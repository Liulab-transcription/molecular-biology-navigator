name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-hostinger-navigator
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}" > ~/.ssh/hostinger_key
          chmod 600 ~/.ssh/hostinger_key
          ssh-keyscan -p 65002 -H 37.44.245.124 >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy static site to Hostinger
        shell: bash
        run: |
          set -euo pipefail
          rsync -az \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'README.md' \
            --exclude '.nojekyll' \
            -e "ssh -i ~/.ssh/hostinger_key -p 65002" \
            ./ \
            u921054797@37.44.245.124:/home/u921054797/domains/nanliulab.com/public_html/navigator/

      - name: Verify deployed files
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/hostinger_key -p 65002 \
            u921054797@37.44.245.124 \
            "grep -Fq 'id=\"alphabet\"' /home/u921054797/domains/nanliulab.com/public_html/navigator/index.html && grep -Fq 'class=\"suggestion ' /home/u921054797/domains/nanliulab.com/public_html/navigator/assets/app.js"

      - name: Verify public website
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 5 --retry-delay 5 \
            "https://navigator.nanliulab.com/?deploy=${GITHUB_SHA}" \
            -o /tmp/navigator-index.html
          curl -fsS --retry 5 --retry-delay 5 \
            "https://navigator.nanliulab.com/assets/app.js?deploy=${GITHUB_SHA}" \
            -o /tmp/navigator-app.js
          grep -Fq 'id="alphabet"' /tmp/navigator-index.html
          grep -Fq 'class="suggestion ' /tmp/navigator-app.js
